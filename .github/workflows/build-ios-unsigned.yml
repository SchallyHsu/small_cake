name: Build Marchkov Helper iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out Marchkov Helper v3.1.7
        uses: actions/checkout@v4
        with:
          repository: VariantConst/Marchkov-Helper
          ref: v3.1.7

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app without code signing
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=3.1.7 \
            --build-number=4

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          rm -rf ipa-package
          mkdir -p ipa-package/Payload
          cp -R build/ios/iphoneos/Runner.app ipa-package/Payload/
          cd ipa-package
          /usr/bin/zip -qry -y ../marchkov-helper-v3.1.7-unsigned.ipa Payload
          cd ..
          unzip -l marchkov-helper-v3.1.7-unsigned.ipa | head -40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: marchkov-helper-v3.1.7-ios-unsigned
          path: marchkov-helper-v3.1.7-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
